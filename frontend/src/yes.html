<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💛 YAYYY!!</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* ---- CONFETTI HEARTS ---- */
    .confetti-heart {
      position: fixed;
      font-size: 1.6rem;
      pointer-events: none;
      animation: confettiFall linear forwards;
      z-index: 1;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-60px) rotate(0deg) scale(0.6); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.9; }
      100% { transform: translateY(110vh) rotate(720deg) scale(1.1); opacity: 0; }
    }

    /* ---- SPARKLE ---- */
    .sparkle {
      position: fixed;
      font-size: 1.1rem;
      pointer-events: none;
      animation: sparklePop 1.2s ease forwards;
      z-index: 1;
    }
    @keyframes sparklePop {
      0%   { transform: scale(0) rotate(0deg); opacity: 0; }
      40%  { transform: scale(1.4) rotate(180deg); opacity: 1; }
      100% { transform: scale(0.6) rotate(360deg); opacity: 0; }
    }

    /* ---- CARD ---- */
    .yes-card {
      width: min(460px, 92vw);
      padding: 2.6rem 2rem 2.2rem;
      text-align: center;
      animation: slideUp 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }

    .big-emoji {
      font-size: 3.5rem;
      animation: heartbeat 1.1s ease-in-out infinite;
      display: inline-block;
      margin-bottom: 0.4rem;
    }

    .yay-cursive {
      font-family: var(--cursive);
      font-size: 2.6rem;
      color: var(--gold);
      text-shadow: var(--glow-gold);
      line-height: 1.4;
    }

    .see-you-pixel {
      font-family: var(--pixel);
      font-size: 0.65rem;
      color: var(--rose-light);
      text-shadow: var(--glow-rose);
      letter-spacing: 3px;
      margin: 1rem 0 0.6rem;
      line-height: 2;
    }

    .name-display {
      font-family: var(--cursive);
      font-size: 2rem;
      color: var(--rose-pale);
      text-shadow: var(--glow-rose);
    }

    /* ---- COUNTDOWN ---- */
    .countdown-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 1.2rem 0;
    }
    .cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cd-num {
      font-family: var(--pixel);
      font-size: 1rem;
      color: var(--gold);
      text-shadow: var(--glow-gold);
      background: rgba(245,200,66,0.08);
      border: 2px solid var(--gold);
      border-radius: 2px;
      width: 56px;
      padding: 0.5rem 0;
      text-align: center;
    }
    .cd-label {
      font-family: var(--pixel);
      font-size: 0.38rem;
      color: var(--text-dim);
      margin-top: 0.3rem;
      letter-spacing: 1px;
    }

    .deco-emoji-final {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 0.8rem 0;
    }
    .deco-emoji-final span {
      font-size: 1.8rem;
      animation: emojiBounce 1.3s ease-in-out infinite;
    }
    .deco-emoji-final span:nth-child(2) { animation-delay:.2s }
    .deco-emoji-final span:nth-child(3) { animation-delay:.4s }
    .deco-emoji-final span:nth-child(4) { animation-delay:.6s }
    .deco-emoji-final span:nth-child(5) { animation-delay:.8s }

    .closing-text {
      font-family: var(--typewriter);
      font-size: 0.95rem;
      color: var(--text-dim);
      margin-top: 0.6rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="hearts-container" id="hearts"></div>

  <div class="page">
    <div class="pixel-box yes-card">

      <!-- Big icon -->
      <div class="big-emoji">💛</div>

      <!-- Yay text -->
      <div class="yay-cursive">Yeayy!! Aku Senang Banget!</div>
      <div class="yay-cursive" style="font-size:1.6rem; color: var(--rose-pale);">💕</div>

      <hr class="pixel-divider" />

      <!-- Deco emojis -->
      <div class="deco-emoji-final">
        <span>🎉</span>
        <span>💝</span>
        <span>🌹</span>
        <span>✨</span>
        <span>🥰</span>
      </div>

      <!-- See you text -->
      <div class="see-you-pixel" id="seeYouText">
        🌙 SEE YOU SATURDAY 🌹
      </div>

      <!-- Name display -->
      <div class="name-display" id="nameDisplay">~ ❤️ ~</div>

      <hr class="pixel-divider" />

      <!-- Countdown -->
      <div style="font-family:var(--pixel); font-size:0.5rem; color:var(--text-dim); letter-spacing:2px; margin-bottom:0.4rem;">
        COUNTDOWN TO OUR DATE
      </div>
      <div id="targetDateBadge" style="font-family:var(--pixel); font-size:0.45rem; color:var(--gold); text-shadow:var(--glow-gold); margin-bottom:0.8rem; letter-spacing:1.5px;"></div>
      <div class="countdown-box">
        <div class="cd-unit">
          <div class="cd-num" id="cd-days">--</div>
          <div class="cd-label">HARI</div>
        </div>
        <div class="cd-unit">
          <div class="cd-num" id="cd-hours">--</div>
          <div class="cd-label">JAM</div>
        </div>
        <div class="cd-unit">
          <div class="cd-num" id="cd-mins">--</div>
          <div class="cd-label">MENIT</div>
        </div>
        <div class="cd-unit">
          <div class="cd-num" id="cd-secs">--</div>
          <div class="cd-label">DETIK</div>
        </div>
      </div>

      <div class="closing-text">
        Aku udah nggak sabar nunggu hari itu! 🌙<br>
        Makasih udah mau jalan sama aku 🌹
      </div>

    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    // ---- Set name ----
    const name = getName();
    if (name) {
      document.getElementById('nameDisplay').textContent = `~ ${name} ❤️ ~`;
    }

    // ---- Date & Countdown Configuration ----
    const CONFIG_INVITE_TEXT = 'SABTU, 5 DESEMBER 2026';
    const TARGET = new Date('2026-12-05T12:00:00Z'); // 19.00 WIB

    let activeInviteText = getCustomDateText(CONFIG_INVITE_TEXT);
    let activeTargetDate = TARGET;
    const savedTargetIso = getCustomDateTarget('');
    if (savedTargetIso) {
      const parsedT = new Date(savedTargetIso);
      if (!isNaN(parsedT.getTime())) {
        activeTargetDate = parsedT;
      }
    }

    function updateSeeYouAndBadge() {
      const badge = document.getElementById('targetDateBadge');
      if (badge) {
        badge.textContent = `📅 ${activeInviteText}`;
      }

      const seeYouEl = document.getElementById('seeYouText');
      if (seeYouEl) {
        const up = (activeInviteText || '').toUpperCase();
        const dayMap = [
          ['MINGGU', 'SUNDAY'], ['AHAD', 'SUNDAY'],
          ['SENIN', 'MONDAY'],
          ['SELASA', 'TUESDAY'],
          ['RABU', 'WEDNESDAY'],
          ['KAMIS', 'THURSDAY'],
          ['JUMAT', 'FRIDAY'], ["JUM'AT", 'FRIDAY'],
          ['SABTU', 'SATURDAY']
        ];
        let matchedDay = '';
        for (const [idDay, enDay] of dayMap) {
          if (up.includes(idDay)) {
            matchedDay = enDay;
            break;
          }
        }
        if (!matchedDay && !isNaN(activeTargetDate.getTime())) {
          const enDays = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
          matchedDay = enDays[activeTargetDate.getDay()] || 'SATURDAY';
        }
        seeYouEl.textContent = `🌙 SEE YOU ${matchedDay || 'SOON'} 🌹`;
      }
    }

    updateSeeYouAndBadge();

    function updateCountdown() {
      const now  = new Date();
      const diff = activeTargetDate - now;
      if (isNaN(diff) || diff <= 0) {
        document.getElementById('cd-days').textContent  = '00';
        document.getElementById('cd-hours').textContent = '00';
        document.getElementById('cd-mins').textContent  = '00';
        document.getElementById('cd-secs').textContent  = '00';
        return;
      }
      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins  = Math.floor((diff % 3600000)  / 60000);
      const secs  = Math.floor((diff % 60000)    / 1000);

      document.getElementById('cd-days').textContent  = String(days).padStart(2,'0');
      document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
      document.getElementById('cd-mins').textContent  = String(mins).padStart(2,'0');
      document.getElementById('cd-secs').textContent  = String(secs).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // ---- Sync name, date config, & onboarding state via pywebview bridge ----
    window.addEventListener('pywebviewready', async () => {
      if (window.pywebview?.api?.get_active_user) {
        try {
          const pyName = await window.pywebview.api.get_active_user();
          if (pyName && pyName !== 'anonymous') {
            setName(pyName);
            document.getElementById('nameDisplay').textContent = `~ ${pyName} ❤️ ~`;
          }
        } catch (e) {}
      }
      if (window.pywebview?.api?.get_date_config) {
        try {
          const dConf = await window.pywebview.api.get_date_config();
          if (dConf?.date_invitation_text) {
            activeInviteText = dConf.date_invitation_text;
            sessionStorage.setItem('custom_date_text', activeInviteText);
          }
          if (dConf?.date_countdown_target) {
            sessionStorage.setItem('custom_date_target', dConf.date_countdown_target);
            const parsedT = new Date(dConf.date_countdown_target);
            if (!isNaN(parsedT.getTime())) {
              activeTargetDate = parsedT;
            }
          }
          updateSeeYouAndBadge();
          updateCountdown();
        } catch (e) {}
      }
      if (window.pywebview?.api?.mark_onboarding_done) {
        try {
          await window.pywebview.api.mark_onboarding_done();
        } catch (e) {}
      }
    });

    // ---- Confetti burst ----
    const CONFETTI = ['💖','💕','🌹','✨','💛','🌸','💫','🎀','🌺','❤️'];
    const SPARKLES = ['✨','⭐','🌟','💫'];

    function launchConfetti() {
      for (let i = 0; i < 28; i++) {
        setTimeout(() => {
          const el = document.createElement('span');
          el.className = 'confetti-heart';
          el.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
          el.style.left = (Math.random() * 100) + 'vw';
          el.style.top  = '-60px';
          el.style.animationDuration = (3 + Math.random() * 4) + 's';
          el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 8000);
        }, i * 110);
      }
    }

    function launchSparkles() {
      for (let i = 0; i < 12; i++) {
        setTimeout(() => {
          const el = document.createElement('span');
          el.className = 'sparkle';
          el.textContent = SPARKLES[Math.floor(Math.random() * SPARKLES.length)];
          el.style.left = (10 + Math.random() * 80) + 'vw';
          el.style.top  = (10 + Math.random() * 70) + 'vh';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1500);
        }, i * 80);
      }
    }

    // Initial burst
    launchConfetti();
    launchSparkles();

    // Repeat every 5 seconds
    setInterval(() => {
      launchConfetti();
      launchSparkles();
    }, 5000);
  </script>
</body>
</html>
